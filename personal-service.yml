server:
  port: 8083

spring:
  application:
    name: personal-service
  datasource:
    url: jdbc:h2:mem:personaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      FAIL_ON_NULL_FOR_PRIMITIVES: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /admin/v3/api-docs
